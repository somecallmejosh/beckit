<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 920" width="1380" height="920"><style>.accent{transform-box:fill-box;transform-origin:50% 60%;animation:float 6s ease-in-out infinite}@keyframes float{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(0,-22px) rotate(-3deg)}}@media (prefers-reduced-motion:reduce){.accent{animation:none}}</style>
