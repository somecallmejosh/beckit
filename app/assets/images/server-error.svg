  <circle cx="1100" cy="770" r="9" fill="#B6B6B3" stroke="#262626" stroke-width="7"/>
  <circle cx="1128" cy="752" r="6" fill="#B6B6B3" stroke="#262626" stroke-width="6"/>

  <!-- Mug on its side -->
  <path d="M722 700 C 718 636, 806 630, 806 694" fill="none" stroke="#262626" stroke-width="34" transform="rotate(-6 760 738)"/>
  <path d="M722 700 C 718 636, 806 630, 806 694" fill="none" stroke="#FFFFFF" stroke-width="14" transform="rotate(-6 760 738)"/>
  <path d="M686 690 h 156 c 18 0 18 96 0 96 h -156 c -18 0 -18 -96 0 -96 z" fill="#FFFFFF" stroke="#262626" stroke-width="11" transform="rotate(-6 760 738)"/>
  <ellipse cx="842" cy="730" rx="20" ry="48" fill="#8E8E8B" stroke="#262626" stroke-width="10" transform="rotate(-6 760 738)"/>
  <path d="M716 718 v40 M746 714 v26" fill="none" stroke="#D2D2CF" stroke-width="10" transform="rotate(-6 760 738)"/>

  <!-- Cat, looking away innocently -->
  <g transform="translate(-40 0)">
    <path d="M598 770 C 660 778, 690 730, 652 700" fill="none" stroke="#262626" stroke-width="34"/>
    <path d="M598 770 C 660 778, 690 730, 652 700" fill="none" stroke="#B6B6B3" stroke-width="14"/>
    <path d="M446 790 C 432 714, 468 664, 522 664 C 578 664, 612 714, 598 790 Z" fill="#B6B6B3" stroke="#262626" stroke-width="11"/>
    <path d="M520 700 C 532 730, 530 760, 520 786" fill="none" stroke="#8E8E8B" stroke-width="10"/>
    <ellipse cx="488" cy="786" rx="28" ry="16" fill="#B6B6B3" stroke="#262626" stroke-width="10"/>
    <ellipse cx="556" cy="786" rx="28" ry="16" fill="#B6B6B3" stroke="#262626" stroke-width="10"/>
    <g transform="rotate(10 522 610)">
      <path d="M470 590 L 466 524 L 512 562 Z M574 590 L 578 524 L 532 562 Z" fill="#B6B6B3" stroke="#262626" stroke-width="11"/>
      <path d="M478 572 L 477 548 L 494 562 Z M566 572 L 567 548 L 550 562 Z" fill="#8E8E8B"/>
      <ellipse cx="522" cy="612" rx="68" ry="58" fill="#B6B6B3" stroke="#262626" stroke-width="11"/>
      <path d="M488 600 q 10 -10 22 0 M534 600 q 10 -10 22 0" fill="none" stroke="#262626" stroke-width="7"/>
      <path d="M523 618 l -6 6 h12 z" fill="#262626" stroke="#262626" stroke-width="5"/>
      <path d="M510 634 q 6 7 13 0 q 7 7 13 0" fill="none" stroke="#262626" stroke-width="6"/>
      <path d="M454 618 h-30 M456 632 l -28 8 M590 618 h30 M588 632 l 28 8" fill="none" stroke="#262626" stroke-width="5"/>
    </g>
  </g>

  <!-- Loose yarn from the cat's paw up to the ball -->
  <path d="M440 794 C 330 806, 270 730, 310 650 C 350 570, 290 490, 370 420 C 430 370, 500 336, 540 304" fill="none" stroke="#0F9488" stroke-width="7"/>

  <!-- Ball of yarn, drifting up -->
  <g class="accent">
    <circle cx="590" cy="250" r="72" fill="#0F9488" stroke="#262626" stroke-width="11"/>
    <path d="M538 208 C 580 232, 612 266, 624 316 M560 192 C 610 220, 644 254, 656 290 M528 254 C 560 268, 584 296, 590 320 M612 184 C 640 204, 658 222, 662 240" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="7"/>
