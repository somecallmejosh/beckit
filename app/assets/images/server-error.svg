  <!-- Sparkles -->
  <path d="M900 330 Q 904 360 930 364 Q 904 368 900 398 Q 896 368 870 364 Q 896 360 900 330 Z" fill="#262626"/>
  <circle cx="900" cy="364" r="5" fill="#F9F9F9"/>
  <path d="M1040 520 Q 1042 536 1056 538 Q 1042 540 1040 556 Q 1038 540 1024 538 Q 1038 536 1040 520 Z" fill="#262626"/>
  <path d="M960 640 q 14 -12 30 -10 M968 672 q 18 -4 30 4" fill="none" stroke="#262626" stroke-width="8"/>
</g>
</svg>
